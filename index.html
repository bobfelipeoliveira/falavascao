<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob: https:; frame-src https://www.youtube-nocookie.com; connect-src https:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#000000">
<title>FALA, VASCÃO! — A casa digital do vascaíno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=Inter:wght@400;600;800;900&family=Chakra+Petch:wght@500;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --black:#000;--panel:#141414;--panel2:#1d1d1d;--line:#2c2c2c;--white:#fff;--text:#f2f2f2;--muted:#a3a3a3;
  --red:#d7141a;--red2:#ff3b41;--ok:#3ccf7a;--warn:#f2b632;--err:#ff4d55;
  --display:'Big Shoulders Display',Impact,'Arial Narrow Bold','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-s:6px;--r-m:12px;--r-l:20px;--side:248px;--nav-h:64px;
  color-scheme:dark;
}
[data-theme="light"]{--black:#f4f4f4;--panel:#fff;--panel2:#ececec;--line:#d6d6d6;--white:#000;--text:#111;--muted:#555;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--black);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ LAYOUT ============ */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--black);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px 18px;text-decoration:none;position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;left:-30px;right:-30px;top:58%;height:10px;background:var(--white);transform:rotate(-14deg);opacity:.9}
.brand svg{flex:none;position:relative;z-index:1}
.brand b{font-family:var(--display);font-weight:900;font-size:27px;letter-spacing:.5px;line-height:.9;position:relative;z-index:1;background:var(--black);padding:2px 4px}
.brand small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.2px;margin-top:3px}
.nav{list-style:none;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-s);text-decoration:none;color:var(--muted);font-weight:600;font-size:15px}
.nav a:hover{color:var(--text);background:var(--panel)}
.nav a.on{color:var(--white);background:var(--panel2);box-shadow:inset 3px 0 0 var(--red)}
.nav svg{width:20px;height:20px;flex:none}
.side-foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.main{min-width:0;padding:0 0 40px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 24px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--black) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar h1{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-width:240px}
.searchbox input{background:none;border:0;outline:0;width:100%;font-size:15px}
.userchip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;font-weight:600;font-size:14px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;flex:none}
.content{padding:24px;max-width:1280px;margin:0 auto}
.bottomnav{display:none}

@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .searchbox{display:none}
  .content{padding:16px 14px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px))}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--black);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottomnav a,.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav-h);text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;background:none;border:0;cursor:pointer}
  .bottomnav svg{width:22px;height:22px}
  .bottomnav .on{color:var(--white)}
  .bottomnav .on svg{color:var(--red2)}
}
.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px}
.only-m{display:none}
@media (max-width:960px){.only-m{display:grid}}

/* ============ TYPO & BLOCKS ============ */
h2.sec{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.05;margin:28px 0 12px;letter-spacing:.2px}
h3{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.1;letter-spacing:.2px}
.lead{color:var(--muted);max-width:68ch}
.prose p{max-width:72ch;margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:18px;min-width:0;position:relative}
.card.click{cursor:pointer;transition:border-color .15s}
.card.click:hover{border-color:var(--muted)}
.card.flat{background:none}
.card h3{margin-bottom:6px}
.kicker{font-size:13px;font-weight:600;color:var(--red2);margin-bottom:4px}
.big{font-family:var(--display);font-weight:900;font-size:46px;line-height:1}
.hr{height:1px;background:var(--line);margin:16px 0}
.empty{border:1px dashed var(--line);border-radius:var(--r-m);padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.note{border-left:3px solid var(--warn);background:var(--panel);padding:10px 14px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:14px;color:var(--muted);margin:12px 0}
.note.red{border-color:var(--red)}

/* status badges */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.st.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.st.part{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.st.pend{color:var(--err);border-color:color-mix(in srgb,var(--err) 50%,transparent)}
.st.demo{color:var(--muted);border-color:var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--white);color:var(--black);border-color:var(--white)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* ============ HERO (signature: diagonal sash) ============ */
.hero{position:relative;overflow:hidden;border-radius:var(--r-l);background:var(--black);border:1px solid var(--line);padding:34px 30px;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate}
.hero::before{content:"";position:absolute;z-index:-1;left:-10%;right:-10%;top:30%;height:84px;background:var(--white);transform:rotate(-13deg);transform-origin:center;animation:sash .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes sash{from{transform:rotate(-13deg) translateX(-110%)}to{transform:rotate(-13deg) translateX(0)}}
.hero .cross{position:absolute;right:26px;top:22px;width:92px;height:92px;z-index:1}
.hero h2{font-family:var(--display);font-weight:900;font-size:clamp(48px,8vw,92px);line-height:.85;letter-spacing:.5px;text-shadow:0 0 0 #000}
.hero h2 span{display:inline-block;background:var(--black);padding:0 8px;margin-left:-8px}
.hero p{margin-top:12px;max-width:52ch;color:var(--muted);background:var(--black);display:inline-block;padding-right:8px}
[data-theme="light"] .hero{background:#000;color:#fff}
[data-theme="light"] .hero::before{background:#fff}
[data-theme="light"] .hero h2 span,[data-theme="light"] .hero p{background:#000}

/* ============ CONTROLS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap;touch-action:manipulation}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red2)}
.btn.white{background:var(--white);color:var(--black);border-color:var(--white)}
.btn.ghost{background:none}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px}
.btn.block{width:100%}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:14px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.field .errmsg{font-size:13px;color:var(--err);min-height:0}
.in,select.in,textarea.in{width:100%;background:var(--black);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 12px;font-size:16px;min-height:46px}
textarea.in{min-height:110px;resize:vertical;line-height:1.4}
.in:focus{border-color:var(--white);outline:0}
.in.bad{border-color:var(--err)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 16px}
.filters .in{width:auto;flex:1 1 160px;min-width:0}

/* ============ TABLES ============ */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--muted);background:var(--panel);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--panel)}
td.wrap{white-space:normal;min-width:220px}

/* ============ MODAL / TOAST / LOADER ============ */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:fade .15s}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(980px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{flex:1}
.modal-b{padding:18px;overflow:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
@media (max-width:640px){.modal-bg{align-items:flex-end;padding:0}.modal{border-radius:var(--r-l) var(--r-l) 0 0;max-height:92dvh;padding-bottom:env(safe-area-inset-bottom,0px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(16px);opacity:0}}
.toasts{position:fixed;z-index:200;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;width:min(440px,92vw);pointer-events:none}
@media (min-width:961px){.toasts{bottom:24px}}
.toast{background:var(--white);color:var(--black);border-radius:var(--r-m);padding:12px 16px;font-weight:600;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .2s;border-left:6px solid var(--ok)}
.toast.err{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 0;color:var(--muted)}
.loader svg{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.boot{position:fixed;inset:0;z-index:300;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#fff;transition:opacity .35s}
.boot b{font-family:var(--display);font-size:42px;font-weight:900}

/* ============ NEWS ============ */
.news{display:flex;flex-direction:column;gap:8px}
.news .meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.news h3{font-size:21px}
.news img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r-s);background:var(--panel2)}

/* ============ TIMELINE ============ */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;margin-bottom:18px}
.tl::before{content:"";position:absolute;left:-23px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--black)}
.tl .yr{font-family:var(--display);font-weight:800;font-size:20px}

/* ============ PITCH ============ */
.pitch{position:relative;width:100%;max-width:520px;aspect-ratio:68/100;margin:0 auto;border-radius:var(--r-m);background:repeating-linear-gradient(180deg,#0f3d1f 0 10%,#11461f 10% 20%);border:2px solid #e8e8e8;overflow:hidden;touch-action:manipulation}
.pitch .lines{position:absolute;inset:0;pointer-events:none}
.slot{position:absolute;transform:translate(-50%,-50%);width:76px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;-webkit-user-select:none;user-select:none}
.slot .dot{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);border:2px dashed rgba(255,255,255,.7);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;font-size:15px}
.slot.filled .dot{background:#000;border:2px solid #fff;box-shadow:inset 0 -12px 0 -6px var(--red)}
.slot.sel .dot{border-color:var(--warn);box-shadow:0 0 0 4px rgba(242,182,50,.45)}
.slot.right .dot{border-color:var(--ok);background:#0d3a20}
.slot.wrong .dot{border-color:var(--err);background:#3a0d10}
.slot .nm{font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.7);padding:1px 6px;border-radius:4px;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.slot.drop .dot{border-color:var(--warn)}
@media (max-width:420px){.slot{width:62px}.slot .dot{width:38px;height:38px;font-size:13px}.slot .nm{font-size:10px;max-width:66px}}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pchip{padding:8px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:14px;cursor:pointer;touch-action:manipulation}
.pchip.sel{background:var(--warn);color:#000;border-color:var(--warn)}
.pchip.used{opacity:.35}

/* ============ GAMES ============ */
.gamecard{overflow:hidden;cursor:pointer;padding:0;display:flex;flex-direction:column}
.gamecard .art{height:118px;position:relative;background:#000;overflow:hidden;border-bottom:1px solid var(--line)}
.gamecard .art::before{content:"";position:absolute;left:-20%;right:-20%;top:46%;height:26px;background:#fff;transform:rotate(-13deg)}
.gamecard .art svg{position:absolute;right:14px;top:14px;width:62px;height:62px}
.gamecard .art .num{position:absolute;left:14px;bottom:8px;font-family:var(--display);font-weight:900;font-size:54px;line-height:1;color:var(--red);background:#000;padding:0 6px}
.gamecard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.gamecard .rec{font-size:13px;color:var(--muted);margin-top:auto}
.scorebar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 14px;margin-bottom:14px;font-weight:600}
.scorebar b{font-family:var(--display);font-size:24px;font-weight:900;color:var(--white)}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:16px;cursor:pointer;margin-bottom:10px;min-height:52px;touch-action:manipulation}
.opt:hover:not(:disabled){border-color:var(--white)}
.opt.right{background:color-mix(in srgb,var(--ok) 25%,var(--panel2));border-color:var(--ok)}
.opt.wrong{background:color-mix(in srgb,var(--err) 25%,var(--panel2));border-color:var(--err)}
.opt:disabled{cursor:default}
.clue{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);margin-bottom:8px;animation:pop .25s}
.clue .n{font-family:var(--display);font-weight:900;font-size:22px;color:var(--red2);line-height:1;min-width:20px}
.clue.locked{opacity:.4;border-style:dashed;animation:none}
.photo-frame{position:relative;width:100%;max-width:340px;aspect-ratio:3/4;margin:0 auto 14px;border-radius:var(--r-m);overflow:hidden;background:#000;border:1px solid var(--line)}
.photo-frame img{width:100%;height:100%;object-fit:cover;transition:filter .5s}
.photo-frame svg{width:100%;height:100%;transition:filter .5s}
.crests{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.crests .arrow{color:var(--muted);font-weight:700}
.crest{width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;text-align:center;animation:pop .3s}
.crest svg{width:52px;height:60px}
.crest.hidden svg{opacity:.25}
.lineup-list{display:grid;gap:6px}
.lineup-list .lp{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:var(--r-s);background:var(--panel2)}
.lineup-list .pos{font-family:var(--display);font-weight:800;width:44px;color:var(--red2)}
.progress{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--red)}
.result-banner{text-align:center;padding:22px;border-radius:var(--r-l);background:var(--black);border:1px solid var(--line);margin-bottom:14px}
.result-banner .big{color:var(--white)}

/* ============ CHARTS ============ */
.chart{width:100%;height:auto;overflow:visible}
.chart .bar{fill:var(--red);transition:opacity .15s}
.chart .bar.alt{fill:var(--white)}
.chart .bar:hover,.chart .bar.hl{opacity:.75}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart text.v{fill:var(--text);font-weight:700}
.chart .axis{stroke:var(--line)}
.tip{position:fixed;z-index:150;background:var(--white);color:var(--black);padding:6px 10px;border-radius:6px;font-size:13px;font-weight:600;pointer-events:none;display:none}
.statline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}

/* ---------------- U: utilidades ---------------- */
const U = {
  $: (s, r=document) => r.querySelector(s),
  $$: (s, r=document) => [...r.querySelectorAll(s)],
  esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },

/* ---------------- Hash: senhas (PBKDF2 / fallback SHA-256) ----------------
   Autenticação LOCAL é demonstrativa. FUTURO: Supabase Auth (bcrypt/argon2 no servidor). */
const Hash = {
  b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); },
  salt(){ const a = new Uint8Array(16); (window.crypto||{}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_,i)=>a[i]=Math.random()*256|0); return Hash.b64(a); },
  async make(password, salt){
    salt = salt || Hash.salt();
    if (window.crypto && crypto.subtle) {
      try {
        const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
        const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:new TextEncoder().encode(salt), iterations:150000}, key, 256);
        return {algo:'pbkdf2-sha256-150k', salt, hash:Hash.b64(bits)};
      } catch(e) { console.warn('WebCrypto indisponível, usando fallback', e); }
    }
    let h = salt + '|' + password; for (let i=0;i<4000;i++) h = Hash.sha256(h);
    return {algo:'sha256-iter-4k', salt, hash:h};
  },
  async verify(password, rec){
    if (!rec) return false;
    let out;
    if (rec.algo === 'sha256-iter-4k') { let h = rec.salt + '|' + password; for (let i=0;i<4000;i++) h = Hash.sha256(h); out = h; }
    else out = (await Hash.make(password, rec.salt)).hash;
    if (out.length !== rec.hash.length) return false;
    let diff = 0; for (let i=0;i<out.length;i++) diff |= out.charCodeAt(i) ^ rec.hash.charCodeAt(i);
    return diff === 0;
  },
  sha256(ascii){ // implementação compacta (fallback quando crypto.subtle não existe)
    const rr=(v,a)=>(v>>>a)|(v<<(32-a)); const mp=Math.pow, wd=mp(2,32); let res='', words=[], al=ascii.length*8;
    const h=[], k=[]; let pc=0; const ic={};
    for(let c=2;pc<64;c++){ if(!ic[c]){ for(let i=0;i<313;i+=c) ic[i]=c; h[pc]=(mp(c,.5)*wd)|0; k[pc++]=(mp(c,1/3)*wd)|0; } }
    let H=h.slice(0,8); ascii=unescape(encodeURIComponent(ascii)); al=ascii.length*8; ascii+='\x80';
    while(ascii.length%64-56) ascii+='\x00';
    for(let i=0;i<ascii.length;i++){ const j=ascii.charCodeAt(i); words[i>>2]|=j<<((3-i)%4)*8; }
    words[words.length]=((al/wd)|0); words[words.length]=al;
    for(let j=0;j<words.length;){ const w=words.slice(j,j+=16), oh=H; H=H.slice(0,8);
      for(let i=0;i<64;i++){ const w15=w[i-15], w2=w[i-2], a=H[0], e=H[4];
        const t1=H[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&H[5])^((~e)&H[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
        const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&H[1])^(a&H[2])^(H[1]&H[2]));
        H=[(t1+t2)|0].concat(H); H[4]=(H[4]+t1)|0; H.length=8; }
      for(let i=0;i<8;i++) H[i]=(H[i]+oh[i])|0; }
    for(let i=0;i<8;i++) for(let j=3;j+1;j--){ const b=(H[i]>>(j*8))&255; res+=((b<16)?'0':'')+b.toString(16); }
    return res;
  }
};

/* ---------------- Store: persistência local ----------------
   FUTURO: substituir por repositório Supabase (PostgreSQL) mantendo a mesma API col()/upsert()/remove(). */
const Store = {
  db:null, memoryOnly:false,
  load(){
    try {
      const raw = localStorage.getItem(APP.storeKey);
      if (raw) { const d = JSON.parse(raw); if (d && d.v === APP.dataVersion && Array.isArray(d.users)) { this.db = d; this.migrate(); return; } }
    } catch(e) { console.warn('Falha ao ler armazenamento', e); }
    this.db = this.fresh(); this.save(true);
  },
  fresh(){ const s = U.clone(SEED); return Object.assign(s, {v:APP.dataVersion, created:new Date().toISOString(), users:[], guest:Profile.blank('Convidado'), teams:[], log:[]}); },
  migrate(){ const s = SEED; for (const k of Object.keys(s)) if (!(k in this.db)) this.db[k] = U.clone(s[k]); },
  save(silent){
    if (this.memoryOnly) return false;
    try { localStorage.setItem(APP.storeKey, JSON.stringify(this.db)); return true; }
    catch(e){ if (!silent) UI.toast('Não foi possível salvar: o armazenamento do navegador está cheio ou bloqueado. Faça um backup no painel.', 'err'); this.memoryOnly = !this.probe(); return false; }
  },
  probe(){ try { localStorage.setItem('fv:probe','1'); localStorage.removeItem('fv:probe'); return true; } catch(e){ return false; } },
  col(name){ if (!Array.isArray(this.db[name])) this.db[name] = []; return this.db[name]; },
  upsert(name, obj){ const c = this.col(name); if (!obj.id) obj.id = U.uid(name.slice(0,3)); const i = c.findIndex(x => x.id === obj.id); if (i >= 0) c[i] = obj; else c.unshift(obj); this.save(); return obj; },
  remove(name, id){ const c = this.col(name); const i = c.findIndex(x => x.id === id); if (i >= 0) { c.splice(i,1); this.save(); return true; } return false; }
};

/* ---------------- UI: toasts, modais, confirmações, loaders ---------------- */
const UI = {
  toast(msg, type='ok', ms=3200){ const el = document.createElement('div'); el.className = 'toast ' + (type==='ok'?'':type); el.textContent = msg; U.$('#toasts').appendChild(el); setTimeout(() => el.remove(), ms); },
  modal({title, body, actions=[], wide=false, onClose}){
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${U.esc(title)}"><div class="modal-h"><h3>${U.esc(title)}</h3><button class="icon-btn" data-x aria-label="Fechar">${ICO('x')}</button></div><div class="modal-b"></div>${actions.length?'<div class="modal-f"></div>':''}</div>`;
    const b = U.$('.modal-b', bg); if (typeof body === 'string') b.innerHTML = body; else if (body) b.appendChild(body);
    const close = () => { bg.remove(); document.removeEventListener('keydown', esc); onClose && onClose(); };
    const esc = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', esc);
    bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-x]')) close(); });
    const f = U.$('.modal-f', bg);
    actions.forEach(a => { const btn = document.createElement('button'); btn.className = 'btn ' + (a.cls||''); btn.textContent = a.label; btn.onclick = async () => { const r = a.onClick ? await a.onClick(bg) : true; if (r !== false) close(); }; f.appendChild(btn); });
    document.body.appendChild(bg); setTimeout(() => { const first = U.$('input,select,textarea,button:not([data-x])', b) || U.$('[data-x]', bg); first && first.focus(); }, 30);
    return {el:bg, body:b, close};
  },
  confirm(message, {ok='Confirmar', danger=true}={}){
    return new Promise(res => { let done = false; UI.modal({title:'Confirmar ação', body:`<p>${U.esc(message)}</p>`, onClose:()=>{ if(!done) res(false); }, actions:[{label:'Cancelar', cls:'ghost', onClick:()=>{done=true;res(false);}}, {label:ok, cls:danger?'red':'white', onClick:()=>{done=true;res(true);}}]}); });
  },
  loader(text='Carregando…'){ return `<div class="loader">${ICO('spin',36)}<span>${U.esc(text)}</span></div>`; },
  empty(title, text, action=''){ return `<div class="empty"><b>${U.esc(title)}</b>${U.esc(text)}${action?`<div style="margin-top:12px">${action}</div>`:''}</div>`; },
  tip(e, text){ const t = U.$('#tip'); if (!text) { t.style.display='none'; return; } t.textContent = text; t.style.display='block'; t.style.left = Math.min(e.clientX + 12, innerWidth - 220) + 'px'; t.style.top = (e.clientY - 34) + 'px'; }
};

/* ---------------- Auth (demonstrativa, local) ---------------- */
const Auth = {
  _user:null, fails:0, lockUntil:0,
  user(){ return this._user; },
  isAdmin(){ return !!(this._user && this._user.role === 'admin'); },
  restore(){
    try { const s = JSON.parse(localStorage.getItem(APP.sessionKey) || 'null'); if (s && s.exp > Date.now()) this._user = Store.db.users.find(u => u.id === s.uid) || null; } catch(e){}
  },
  setSession(u){ this._user = u; try { localStorage.setItem(APP.sessionKey, JSON.stringify({uid:u.id, exp:Date.now() + 7*864e5})); } catch(e){} },
  logout(){ this._user = null; try { localStorage.removeItem(APP.sessionKey); } catch(e){} Shell.refreshUser(); UI.toast('Você saiu da sua conta.'); Router.go('inicio'); },
  validatePassword(p){
    const errs = [];
    if (p.length < 6) errs.push('mínimo de 6 caracteres');
    if (!/[A-Z]/.test(p)) errs.push('uma letra maiúscula');
    if (!/[0-9\W_]/.test(p)) errs.push('um número ou caractere especial');
    return errs;
  },
  validateRegistration(f){
    const e = {};
    if (f.name.trim().split(/\s+/).length < 2) e.name = 'Informe nome e sobrenome.';
    if (!f.birth) e.birth = 'Informe a data de nascimento.';
    else { const age = (Date.now() - new Date(f.birth).getTime()) / 31557600000; if (isNaN(age) || age < 0 || age > 120) e.birth = 'Data inválida.'; else if (age < 13) e.birth = 'Cadastro disponível a partir de 13 anos (LGPD, art. 14 — exige consentimento dos responsáveis).'; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email)) e.email = 'E-mail inválido.';
    if (!/^[a-zA-Z0-9_.]{3,20}$/.test(f.login)) e.login = 'Use 3 a 20 caracteres: letras, números, ponto ou sublinhado.';
    else if (Store.db.users.some(u => u.login.toLowerCase() === f.login.toLowerCase() && (!f.editingId || u.id !== f.editingId))) e.login = 'Este login já existe neste navegador.';
    if (!f.editingId || f.password) {
      const pe = this.validatePassword(f.password); if (pe.length) e.password = 'A senha precisa de: ' + pe.join(', ') + '.';
      if (f.password !== f.password2) e.password2 = 'As senhas não conferem.';
    }
    if (f.favs.filter(x => x.trim()).length < 3) e.favs = 'Informe três jogadores favoritos.';
    if (!f.editingId && !f.consent) e.consent = 'É preciso concordar com o uso local dos dados.';
    return e;
  },
  async register(f){
    const isFirst = Store.db.users.length === 0;
    const u = {id:U.uid('usr'), name:f.name.trim(), birth:f.birth, email:f.email.trim().toLowerCase(), login:f.login.trim(), pass:await Hash.make(f.password), role:isFirst?'admin':'torcedor', created:new Date().toISOString(), profile:Profile.blank(f.login.trim())};
    u.profile.favPlayers = f.favs.map(s => s.trim()).filter(Boolean).slice(0,3);
    Store.db.users.push(u); Store.save(); this.setSession(u); return u;
  },
  async login(login, password){
    if (Date.now() < this.lockUntil) throw new Error(`Muitas tentativas. Aguarde ${Math.ceil((this.lockUntil-Date.now())/1000)} s.`);
    const u = Store.db.users.find(x => x.login.toLowerCase() === String(login).trim().toLowerCase());
    const ok = u ? await Hash.verify(password, u.pass) : (await Hash.make(password), false); // tempo similar p/ login inexistente
    if (!ok) { this.fails++; if (this.fails >= 5) { this.lockUntil = Date.now() + 30000; this.fails = 0; } throw new Error('Login ou senha incorretos.'); }
    this.fails = 0; this.setSession(u); return u;
  }
};

  history:[
    {id:'h1', title:'Fundação (1898)', era:'1898', status:'confirmado', source:'Site oficial CRVG; Netvasco — História', body:'O Club de Regatas Vasco da Gama foi fundado em 21 de agosto de 1898, no Rio de Janeiro, por um grupo de imigrantes portugueses e brasileiros ligados ao remo, o esporte mais popular da cidade na época. O nome homenageia o navegador Vasco da Gama, em referência aos 400 anos da viagem que abriu a rota marítima para as Índias (1498).'},
    {id:'h2', title:'O futebol chega ao clube', era:'1915–1923', status:'parcial', source:'Netvasco — História; RSSSF', body:'O futebol passou a fazer parte do clube em meados da década de 1910, após a incorporação de uma agremiação de futebol de origem portuguesa. O Vasco começou nas divisões inferiores do Campeonato Carioca e subiu degrau por degrau até chegar à primeira divisão. Datas exatas da incorporação variam entre fontes e estão marcadas para verificação.'},
    {id:'h3', title:'Os Camisas Negras e o título de 1923', era:'1923', status:'confirmado', source:'Netvasco — História; site oficial', body:'Em 1923, no ano de estreia na divisão principal, o Vasco foi campeão carioca com um time formado em grande parte por atletas negros, mestiços e operários, numa época em que o futebol da elite carioca era praticado por jovens brancos de famílias abastadas. A conquista ficou conhecida pelos "Camisas Negras", apelido ligado ao uniforme e à origem popular do elenco.'},
    {id:'h4', title:'A Resposta Histórica (1924)', era:'1924', status:'confirmado', source:'Site oficial CRVG; Netvasco — História', body:'Após o título de 1923, os grandes clubes fundaram uma nova liga (AMEA) e condicionaram a entrada do Vasco à exclusão de doze jogadores — atletas negros e trabalhadores considerados de "profissão duvidosa". Em 7 de abril de 1924, o presidente José Augusto Prestes recusou a exigência por carta, documento que ficou conhecido como Resposta Histórica. O Vasco preferiu não participar da nova liga a abrir mão de seus atletas e disputou o campeonato da LMDT, do qual foi campeão.'},
    {id:'h5', title:'São Januário', era:'1927', status:'confirmado', source:'Site oficial; Netvasco — História', body:'Para cumprir a exigência de ter estádio próprio, o clube mobilizou sócios e torcedores numa campanha de arrecadação. O Estádio Vasco da Gama, em São Januário, foi inaugurado em 21 de abril de 1927 e foi por anos o maior estádio do Brasil. Além do futebol, recebeu atos políticos marcantes da Era Vargas. Hoje a capacidade varia conforme laudos; em novembro de 2026 discutia-se a liberação de 24.155 lugares.'},
    {id:'h6', title:'O Expresso da Vitória', era:'Anos 1940–1950', status:'parcial', source:'Netvasco — História; RSSSF', body:'Na segunda metade dos anos 1940 o Vasco formou um dos maiores times da história do futebol brasileiro, apelidado de Expresso da Vitória. Nomes como Ademir de Menezes, Barbosa, Danilo Alvim, Friaça e Chico conquistaram títulos cariocas em sequência e o Campeonato Sul-Americano de Campeões de 1948, em Santiago do Chile. Vários deles formaram a base da Seleção Brasileira na Copa de 1950.'},
    {id:'h7', title:'Na Seleção campeã de 1958', era:'1958', status:'confirmado', source:'Registros FIFA; Netvasco', body:'O zagueiro Bellini, do Vasco, foi o capitão da Seleção Brasileira campeã do mundo em 1958 e eternizou o gesto de erguer a taça sobre a cabeça. Vavá e Orlando, também ligados ao clube naquele período, integraram o elenco campeão.'},
    {id:'h8', title:'Roberto Dinamite e o primeiro Brasileiro', era:'1970–1980', status:'confirmado', source:'Netvasco — Decisões; site oficial', body:'Revelado no clube, Roberto Dinamite tornou-se o maior artilheiro da história vascaína. Em 1974 o Vasco conquistou seu primeiro Campeonato Brasileiro, vencendo o Cruzeiro na decisão disputada no Maracanã.'},
    {id:'h9', title:'A década dourada: 1989–2000', era:'1989–2000', status:'confirmado', source:'Netvasco — Decisões', body:'O período reúne os Brasileiros de 1989, 1997 e 2000, a Libertadores de 1998 — conquistada no ano do centenário — e a Copa Mercosul de 2000, com a virada por 4 a 3 sobre o Palmeiras. Gerações com Bebeto, Edmundo, Juninho Pernambucano, Felipe, Pedrinho, Mauro Galvão, Carlos Germano e Romário marcaram a era.'},
    {id:'h10', title:'Quedas e reconstruções', era:'2008–2022', status:'parcial', source:'Netvasco; ge', body:'O clube enfrentou o primeiro rebaixamento em 2008 e voltou como campeão da Série B em 2009. Em 2011 conquistou a Copa do Brasil. Vieram novos descensos (2013, 2015 e 2020) e retornos à elite, o último deles garantido em novembro de 2022.'},
    {id:'h11', title:'SAF e história recente', era:'2022–2026', status:'parcial', source:'Netvasco; Exame', body:'O futebol passou a ser gerido por uma Sociedade Anônima do Futebol (SAF) em 2022, com a 777 Partners como investidora. Em 2024 o clube associativo retomou o controle por decisão judicial. Em 2026, o processo de venda da SAF envolve a família Lamacchia e é acompanhado de disputas judiciais; detalhes mudam rapidamente — consulte as fontes de notícias.'}
  ],

/* resposta digitada: igualdade normalizada com o nome ou apelidos, tolerando 1 erro de digitação em nomes longos */
U.lev = (a,b) => { const m=a.length,n=b.length; if (Math.abs(m-n)>2) return 9; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++) d[0][j]=j; for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; };
U.answerMatches = (input, answers) => { const a = U.norm(input); if (a.length < 2) return false; return answers.some(x => { const b = U.norm(x); return a === b || (b.length >= 6 && U.lev(a,b) <= 1); }); };

/* ---------------- Charts (SVG próprio, sem dependências) ---------------- */
const Chart = {
  bars(data, {h=220, alt=false, unit=''}={}){
    if (!data.length) return UI.empty('Sem dados', 'Cadastre registros para gerar este gráfico.');
    const w = Math.max(320, data.length * 46), pad = 28, max = Math.max(1, ...data.map(d => d.value)), bw = (w - pad) / data.length;
    const bars = data.map((d,i) => { const bh = (d.value / max) * (h - 60); const x = pad + i*bw + bw*.15, y = h - 30 - bh;
      return `<g><rect class="bar ${alt?'alt':''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${Math.max(1,bh).toFixed(1)}" rx="3" data-tip="${U.esc(d.label + ': ' + d.value + unit + (d.hint ? ' — ' + d.hint : ''))}" tabindex="0"/><text class="v" x="${(x + bw*.35).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle">${d.value}</text><text x="${(x + bw*.35).toFixed(1)}" y="${h-12}" text-anchor="middle">${U.esc(String(d.label).slice(0,10))}</text></g>`; }).join('');
    return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${w} ${h}" style="min-width:${Math.min(w,640)}px" role="img"><line class="axis" x1="${pad}" y1="${h-30}" x2="${w}" y2="${h-30}"/>${bars}</svg></div>`;
  },
  wdl(w, d, l){
    const t = w + d + l; if (!t) return UI.empty('Sem partidas', 'Nenhuma partida com placar cadastrada para este recorte.');
    let x = 0; const seg = (v, c, lbl) => { const ww = v / t * 100; const r = `<rect x="${x}%" y="0" width="${ww}%" height="28" fill="${c}" data-tip="${lbl}: ${v} (${Math.round(ww)}%)"/>`; x += ww; return r; };
    return `<svg class="chart" viewBox="0 0 100 28" preserveAspectRatio="none" style="height:28px;border-radius:6px">${seg(w,'#3ccf7a','Vitórias')}${seg(d,'#a3a3a3','Empates')}${seg(l,'#ff4d55','Derrotas')}</svg><div class="row small muted" style="margin-top:6px"><span>V ${w}</span><span>E ${d}</span><span>D ${l}</span><span>Aproveitamento ${Math.round((w*3+d)/(t*3)*100)}%</span></div>`;
  }
};
document.addEventListener('mousemove', e => { const t = e.target.closest && e.target.closest('[data-tip]'); UI.tip(e, t ? t.getAttribute('data-tip') : ''); });
document.addEventListener('click', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) { UI.tip(e, t.getAttribute('data-tip')); setTimeout(() => UI.tip(e,''), 1800); } });

/* ---------------- Domínio: partidas ---------------- */
const Matches = {
  all(){ return Store.col('matches').slice().sort((a,b) => (b.date||'').localeCompare(a.date||'')); },
  played(){ return this.all().filter(m => Number.isFinite(m.gf) && Number.isFinite(m.ga)); },
  next(){ const t = U.today(); return Store.col('matches').filter(m => !Number.isFinite(m.gf) && (m.date||'') >= t).sort((a,b) => (a.date+(a.time||'')).localeCompare(b.date+(b.time||''))); },
  label(m){ return m.home === false ? `${m.opponent} x Vasco` : m.home === true ? `Vasco x ${m.opponent}` : `Vasco x ${m.opponent} (campo neutro/a confirmar)`; },
  score(m){ if (!Number.isFinite(m.gf)) return '—'; return m.home === false ? `${m.ga} x ${m.gf}` : `${m.gf} x ${m.ga}`; },
  res(m){ return m.gf > m.ga ? 'V' : m.gf < m.ga ? 'D' : 'E'; },
  summary(list){ const s = {w:0,d:0,l:0,gf:0,ga:0,n:0}; list.forEach(m => { if (!Number.isFinite(m.gf)) return; s.n++; s.gf += m.gf; s.ga += m.ga; const r = this.res(m); r==='V'?s.w++:r==='E'?s.d++:s.l++; }); s.pct = s.n ? Math.round((s.w*3+s.d)/(s.n*3)*100) : 0; return s; },
  open(id){ const m = U.byId(Store.col('matches'), id); if (!m) return UI.toast('Partida não encontrada.', 'err');
    UI.modal({title:this.label(m), body:`<div class="big" style="margin-bottom:8px">${U.esc(this.score(m))}</div><dl class="kv"><dt>Data</dt><dd>${U.fmtDate(m.date)} ${U.esc(m.time||'')}</dd><dt>Competição</dt><dd>${U.esc(m.comp)}</dd><dt>Local</dt><dd>${U.esc(m.venue||'n/d')}</dd><dt>Gols</dt><dd>${U.esc(m.scorers||'n/d')}</dd>${m.lineup?`<dt>Escalação</dt><dd>${U.esc(m.lineup)}</dd>`:''}<dt>Observações</dt><dd>${U.esc(m.notes||'—')}</dd><dt>Fonte</dt><dd>${Pages.srcLink(m.source, m.url)}</dd><dt>Situação</dt><dd>${badge(m.status)}</dd></dl>`}); }
};

/* ---------------- Router (hash, sem recarregar) ---------------- */
const Router = {
  go(r, param){ location.hash = '#/' + r + (param ? '/' + encodeURIComponent(param) : ''); },
  parse(){ const h = location.hash.replace(/^#\/?/, '').split('/'); return {r:h[0] || 'inicio', param:h[1] ? decodeURIComponent(h.slice(1).join('/')) : ''}; },
  render(){
    const {r, param} = this.parse();
    const page = Pages[r] || Pages.inicio;
    if (page.admin && !Auth.isAdmin()) { U.$('#view').innerHTML = UI.empty('Área restrita', 'O painel administrativo exige login com conta de administrador local.', `<a class="btn red" href="#/perfil">Entrar</a>`); U.$('#pageTitle').textContent = 'Acesso restrito'; return; }
    U.$('#pageTitle').textContent = page.title || 'FALA, VASCÃO!';
    document.title = (page.title ? page.title + ' — ' : '') + 'FALA, VASCÃO!';
    Shell.setActive(Pages[r] ? r : 'inicio');
    const view = U.$('#view'); view.innerHTML = UI.loader();
    try { page.render(view, param); } catch(e) { console.error(e); view.innerHTML = UI.empty('Algo deu errado nesta tela', 'Recarregue a página. Se o erro persistir, restaure um backup no painel administrativo. Detalhe: ' + e.message); }
    window.scrollTo(0,0);
  }
};
window.addEventListener('hashchange', () => Router.render());

/* ---------------- Feeds RSS (best-effort, respeitando CORS) ---------------- */
const Feeds = {
  async load(feed, out, btn){
    const url = U.safeUrl(feed && feed.url); if (!url) { out.innerHTML = '<p class="small muted">URL inválida.</p>'; return; }
    btn.disabled = true; out.innerHTML = UI.loader('Consultando feed…');
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 9000);
    try {
      const r = await fetch(url, {signal:ctrl.signal, credentials:'omit', referrerPolicy:'no-referrer'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const xml = new DOMParser().parseFromString(await r.text(), 'text/xml');
      if (xml.querySelector('parsererror')) throw new Error('Feed inválido');
      const items = [...xml.querySelectorAll('item, entry')].slice(0, 12).map(it => ({t:(it.querySelector('title')||{}).textContent||'', l:(it.querySelector('link')||{}).textContent || (it.querySelector('link')||{getAttribute(){return ''}}).getAttribute('href') || '', d:(it.querySelector('pubDate, updated')||{}).textContent||''}));
      out.innerHTML = items.length ? `<ul style="margin-top:10px;padding-left:18px">${items.map(i => `<li style="margin-bottom:6px">${Pages.srcLink(i.t.trim(), i.l.trim())} <span class="small muted">${U.esc(i.d.slice(0,22))}</span></li>`).join('')}</ul>` : '<p class="small muted">Feed sem itens.</p>';
      UI.toast('Feed carregado.');
    } catch(e) {
      out.innerHTML = `<div class="note red">Não foi possível ler este feed diretamente do navegador (${U.esc(e.name==='AbortError'?'tempo esgotado':e.message)}). Normalmente isso ocorre por bloqueio de CORS ou por falta de conexão. ${Pages.srcLink('Abrir o feed na fonte', url)} — na versão online, a leitura será feita por um servidor intermediário.</div>`;
    } finally { clearTimeout(to); btn.disabled = false; }
  }
};

/* ---------------- Desafio diário ---------------- */
const Daily = {
  render(box){
    const qz = Store.col('quiz'); if (!qz.length) { box.innerHTML = '<p class="muted">Sem perguntas cadastradas.</p>'; return; }
    const day = U.today(), q = qz[U.hashStr('daily' + day) % qz.length], p = Profile.current(), done = p.daily[day];
    box.innerHTML = `<div class="kicker">Desafio diário · ${U.fmtDate(day)}</div><p style="font-weight:600;margin-bottom:8px">${U.esc(q.q)}</p>${done ? `<p class="${done.ok?'':'muted'}">${done.ok ? 'Você acertou hoje: +50 pts.' : 'Resposta registrada hoje. Volte amanhã!'}</p><p class="small muted">Resposta: ${U.esc(q.opts[q.a])}. ${U.esc(q.exp)}</p>` : q.opts.map((o,i) => `<button class="opt" style="padding:10px 12px;min-height:44px;font-size:14px;margin-bottom:6px" data-i="${i}">${U.esc(o)}</button>`).join('')}`;
    if (done) return;
    const round = {};
    U.$$('.opt', box).forEach(b => b.onclick = () => {
      if (round.settled) return; const ok = +b.dataset.i === q.a;
      p.daily[day] = {ok}; Score.award(round, 'daily', ok ? 50 : 0, ok ? 'Acertou o desafio diário' : 'Errou o desafio diário');
      if (Object.keys(p.daily).length >= 3) Profile.medal('daily3');
      Store.save(); UI.toast(ok ? 'Certa! +50 pontos.' : 'Não foi dessa vez.', ok ? 'ok' : 'warn'); Daily.render(box);
    });
  }
};

      ${groups.map(([pos, list]) => `<h2 class="sec">${pos}${pos==='Pendente'?' (posição a confirmar)':'s'}</h2><div class="tablewrap"><table><thead><tr><th>Nº</th><th>Atleta</th><th>Jogos</th><th>Gols</th></tr></thead><tbody>${list.map(p => `<tr class="click" data-n="${U.esc(p.name)}"><td>${U.esc(p.num||'n/d')}</td><td><b>${U.esc(p.name)}</b></td><td>${U.esc(p.games||'n/d')}</td><td>${U.esc(p.goals||'n/d')}</td></tr>`).join('')}</tbody></table></div>`).join('') || UI.empty('Nenhum atleta neste filtro', 'Limpe a busca ou a posição.')}

  const tabCal = box => { box.innerHTML = `<div class="filters"><select class="in" id="jc"><option value="">Todas as competições</option>${comps.map(c => `<option>${U.esc(c)}</option>`).join('')}</select><select class="in" id="jy"><option value="">Todos os anos</option>${years.map(y => `<option>${y}</option>`).join('')}</select><input class="in" id="jq" type="search" placeholder="Adversário ou artilheiro">${Auth.isAdmin()?`<button class="btn red" id="addM">${ICO('plus')} Cadastrar partida</button>`:''}</div><div class="tablewrap"><table><thead><tr><th>Data</th><th>Competição</th><th>Partida</th><th>Placar</th><th>Local</th><th>Situação</th>${Auth.isAdmin()?'<th></th>':''}</tr></thead><tbody id="jb"></tbody></table></div><p class="small muted" style="margin-top:8px">Placares sempre exibidos na ordem mandante x visitante. Clique em uma partida para ver gols, escalação e fonte.</p>`;
    const draw = () => { const list = ms().filter(m => (!st.comp || m.comp === st.comp) && (!st.year || m.date.startsWith(st.year)) && (!st.q || U.norm(m.opponent + ' ' + (m.scorers||'')).includes(U.norm(st.q))));

      U.$$('tr[data-id]', box).forEach(r => r.onclick = () => Matches.open(r.dataset.id)); Pages.bindAdmin(box, draw); };

    const a = U.$('#addM', box); if (a) a.onclick = () => Admin.edit('matches', null, () => Router.render()); draw(); };
  const tabH2H = box => { box.innerHTML = `<p class="lead">Escolha um adversário para ver o retrospecto calculado a partir das partidas cadastradas.</p><div class="chips" style="margin:12px 0">${rivals.map(r => `<button class="chip" data-o="${r}">Vasco x ${r}</button>`).join('')}</div><div class="filters"><select class="in" id="ho"><option value="">Outro adversário cadastrado…</option>${opps.map(o => `<option>${U.esc(o)}</option>`).join('')}</select></div><div id="hr"></div>`;
    const draw = o => { st.opp = o; U.$$('.chip', box).forEach(c => c.classList.toggle('on', c.dataset.o === o)); const list = Matches.all().filter(m => m.opponent === o), s = Matches.summary(list);
      U.$('#hr', box).innerHTML = !o ? '' : list.length ? `<div class="card"><h3>Vasco x ${U.esc(o)}</h3>${Chart.wdl(s.w,s.d,s.l)}<div class="statline"><span>Gols pró / contra</span><b>${s.gf} / ${s.ga}</b></div><p class="small muted">Base: ${s.n} partida(s) com placar cadastradas. Não é o retrospecto histórico completo.</p></div><div class="tablewrap" style="margin-top:12px"><table><tbody>${list.map(m => `<tr class="click" data-id="${m.id}"><td>${U.fmtDate(m.date)}</td><td>${U.esc(m.comp)}</td><td>${U.esc(Matches.label(m))}</td><td><b>${U.esc(Matches.score(m))}</b></td></tr>`).join('')}</tbody></table></div>` : UI.empty(`Nenhum Vasco x ${o} cadastrado`, 'O retrospecto completo deste clássico ainda não foi verificado e importado. O administrador pode cadastrar os jogos com fonte (RSSSF e Netvasco são as referências).', Auth.isAdmin()?`<button class="btn red" id="addH2">Cadastrar partida</button>`:'');
      U.$$('tr[data-id]', box).forEach(r => r.onclick = () => Matches.open(r.dataset.id)); const ad = U.$('#addH2', box); if (ad) ad.onclick = () => Admin.edit('matches', null, () => Router.render(), {opponent:o}); };
    U.$$('.chip', box).forEach(c => c.onclick = () => draw(c.dataset.o)); U.$('#ho', box).onchange = e => e.target.value && draw(e.target.value); if (st.opp) draw(st.opp); };
  const tabs = {cal:tabCal, h2h:tabH2H};
  U.$$('.tabs button', v).forEach(b => b.onclick = () => { U.$$('.tabs button', v).forEach(x => x.classList.toggle('on', x === b)); tabs[b.dataset.t](U.$('#jt', v)); });
  if (param) { U.$$('.tabs button', v)[1].click(); } else tabCal(U.$('#jt', v));
}};

/* ---------------- Memória Vascaína ---------------- */
const VID_CATS = {gols:'Gols históricos', melhores:'Melhores momentos', jogos:'Jogos completos', entrevistas:'Entrevistas', documentarios:'Documentários', narracoes:'Narrações', imagens:'Imagens históricas', conquistas:'Grandes conquistas'};
Pages.memoria = { title:'Memória Vascaína', render(v){
  let cat = '';
  v.innerHTML = `<p class="lead">Biblioteca audiovisual com links para as publicações originais. Vídeos só são incorporados quando o administrador cadastra um vídeo público do YouTube com incorporação autorizada pelo dono do canal; nada é baixado ou reproduzido fora da fonte.</p><div class="chips" style="margin:14px 0" id="vc"><button class="chip on" data-c="">Tudo</button>${Object.entries(VID_CATS).map(([k,t]) => `<button class="chip" data-c="${k}">${t}</button>`).join('')}</div>${Auth.isAdmin()?`<button class="btn red" id="addV" style="margin-bottom:14px">${ICO('plus')} Cadastrar vídeo</button>`:''}<div class="grid g3" id="vl"></div>`;
  const draw = () => { const list = Store.col('videos').filter(x => !cat || x.cat === cat).sort((a,b) => a.year - b.year);

    U.$$('[data-play]', v).forEach(b => b.onclick = () => { const id = U.ytId(b.dataset.play); if (!id) return; b.parentElement.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}" title="Vídeo" allow="encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"></iframe>`; });
    Pages.bindAdmin(v, draw); };
  U.$$('#vc .chip', v).forEach(c => c.onclick = () => { U.$$('#vc .chip', v).forEach(x => x.classList.remove('on')); c.classList.add('on'); cat = c.dataset.c; draw(); });

    <div><div class="card"><div class="kicker">Jogando como convidado</div><h3>${g.points} pontos</h3><p class="small muted">Seu progresso fica salvo neste navegador. Ao criar uma conta, ele é transferido para ela.</p></div>

  },

  loginForm(box){

  },
  regFields(u){ const f = u ? u.profile.favPlayers : [];

    <div class="field"><label for="rb">Data de nascimento</label><input class="in" id="rb" name="birth" type="date" value="${U.esc(u?u.birth:'')}"><span class="errmsg" data-err="birth"></span></div>
    <div class="field"><label for="re">E-mail</label><input class="in" id="re" name="email" type="email" autocomplete="email" value="${U.esc(u?u.email:'')}"><span class="errmsg" data-err="email"></span></div>
    <div class="field"><label for="rl">Login</label><input class="in" id="rl" name="login" autocomplete="username" value="${U.esc(u?u.login:'')}" ${u?'disabled':''}><span class="errmsg" data-err="login"></span></div>
    <div class="field"><label for="rp">${u?'Nova senha (opcional)':'Senha'}</label><input class="in" id="rp" name="password" type="password" autocomplete="new-password"><span class="hint">Mínimo de 6 caracteres, uma letra maiúscula e um número ou caractere especial.</span><span class="errmsg" data-err="password"></span></div>
    <div class="field"><label for="rp2">Confirmação da senha</label><input class="in" id="rp2" name="password2" type="password" autocomplete="new-password"><span class="errmsg" data-err="password2"></span></div>
    <div class="field"><label>Três jogadores favoritos do Vasco</label>${[0,1,2].map(i => `<input class="in" name="fav${i}" list="favlist" value="${U.esc(f[i]||'')}" placeholder="Favorito ${i+1}" style="margin-bottom:6px">`).join('')}<datalist id="favlist">${Store.col('players').map(p => `<option value="${U.esc(p.name)}">`).join('')}</datalist><span class="errmsg" data-err="favs"></span></div>`; },
  readReg(box, editingId){ const g = n => (U.$(`[name="${n}"]`, box)||{}).value || ''; return {name:g('name'), birth:g('birth'), email:g('email'), login:g('login'), password:g('password'), password2:g('password2'), favs:[g('fav0'),g('fav1'),g('fav2')], consent:(U.$('#rc', box)||{}).checked, editingId}; },
  regForm(box){
    box.innerHTML = this.regFields() + `<div class="field"><label class="row" style="font-weight:500"><input type="checkbox" id="rc" name="consent"> Concordo que estes dados fiquem salvos apenas neste navegador (LGPD). Não coletamos CPF, endereço ou telefone.</label><span class="errmsg" data-err="consent"></span></div><button class="btn red block" id="rgo">Criar conta</button>`;
    U.$('#rgo', box).onclick = async () => { const f = this.readReg(box), errs = Auth.validateRegistration(f); this.fieldErr(box, errs);

const GameKit = {
  header(box, id, extra=''){ const rec = Profile.current().records[id];
    box.innerHTML = `<div class="spread" style="margin-bottom:12px"><a class="btn sm ghost" href="#/games">Voltar ao Game Center</a><span class="small muted">Recorde: <b>${rec ?? '—'}</b></span></div><h2 class="sec" style="margin-top:0">${GAME_NAMES[id]}</h2>${extra}<div id="gbody"></div>`; return U.$('#gbody', box); },
  levels(box, opts, onPick, label='Escolha a dificuldade'){ box.innerHTML = `<p class="lead" style="margin-bottom:12px">${label}</p><div class="grid g4">${opts.map(([k,t,d]) => `<button class="card click" style="text-align:left" data-k="${k}"><h3>${t}</h3><p class="small muted">${d}</p></button>`).join('')}</div>`; U.$$('[data-k]', box).forEach(b => b.onclick = () => onPick(b.dataset.k)); },
  redact(text, words){ let t = String(text||''); words.filter(w => w && w.length > 2).forEach(w => { t = t.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'), '███'); }); return t; },
  finish(box, {title, points, lines='', again, extra=''}){ box.insertAdjacentHTML('beforeend', `<div class="result-banner" style="margin-top:16px"><div class="kicker">${U.esc(title)}</div><div class="big">${points} pts</div>${extra}</div>${lines}<div class="row" style="justify-content:center;margin-top:12px"><button class="btn red" data-again>Jogar novamente</button><a class="btn ghost" href="#/games">Outros jogos</a></div>`); U.$('[data-again]', box).onclick = again; U.$('[data-again]', box).scrollIntoView({behavior:'smooth', block:'center'}); },
  silhouette(seed){ const h = U.hashStr(seed); const hair = ['M30 40 Q50 16 70 40 L70 46 L30 46Z','M28 44 Q50 10 72 44 Q60 34 50 36 Q40 34 28 44Z','M32 42 Q50 24 68 42Z'][h%3];
    return `<svg viewBox="0 0 100 133" aria-label="Silhueta"><rect width="100" height="133" fill="#1c1c1c"/><path d="M-10 70 L110 40 L110 58 L-10 88Z" fill="#2e2e2e"/><ellipse cx="50" cy="52" rx="19" ry="23" fill="#0a0a0a"/><path d="${hair}" fill="#000"/><path d="M14 133 Q16 92 50 86 Q84 92 86 133Z" fill="#0a0a0a"/><path d="M34 90 L66 124 L60 128 L28 94Z" fill="#3a3a3a"/></svg>`; },
  crest(name, color, hidden){ const ini = hidden ? '?' : U.initials(name).slice(0,3), vasco = !hidden && U.norm(name) === 'vasco';
    return `<div class="crest ${hidden?'hidden':''}"><svg viewBox="0 0 52 60"><path d="M4 4h44v24c0 16-10 24-22 28C14 52 4 44 4 28Z" fill="${hidden?'#222':U.esc(color)}" stroke="#fff" stroke-width="2"/>${vasco ? '<path d="M6 34 L46 14 L46 22 L6 42Z" fill="#fff"/><path d="M26 28L22 18Q26 20 30 18ZM26 28L36 24Q34 28 36 32ZM26 28L30 38Q26 36 22 38ZM26 28L16 32Q18 28 16 24Z" fill="#d7141a"/>' : `<text x="26" y="34" text-anchor="middle" font-family="Barlow,sans-serif" font-weight="700" font-size="13" fill="#fff">${U.esc(ini)}</text>`}</svg><span>${hidden ? '???' : U.esc(name)}</span></div>`; }
};
const Games = {

      let tries = 0; const blur = [22,16,11,7,3,0];

        <div class="grid g2"><div><div class="photo-frame" id="pf">${t.photo ? `<img src="${U.esc(U.safeImg(t.img))}" alt="Jogador misterioso" style="filter:blur(22px)" referrerpolicy="no-referrer">` : GameKit.silhouette(t.id).replace('<svg', '<svg style="filter:blur(6px)"')}</div>${t.photo && t.credit ? `<p class="small muted" style="text-align:center">Crédito: ${U.esc(t.credit)} · ${U.esc(t.license||'')}</p>` : ''}</div>

      const drawClues = () => { U.$('#cl', box).innerHTML = clues.map((c,i) => i <= tries - (lvl==='dificil'?1:0) ? `<div class="clue"><span class="n">${i+1}</span><span>${U.esc(c)}</span></div>` : `<div class="clue locked"><span class="n">${i+1}</span><span>Pista bloqueada</span></div>`).join('');

  quiz:{ n:5, desc:'Perguntas de história, títulos, partidas e recordes. Quatro níveis, feedback imediato.', render(box){

  lineup:{ n:6, desc:'Monte no campo a escalação de um time histórico. Arraste ou toque para posicionar.', render(box){

  play(box, l){
    const round = {}, correct = l.players.map(p => p.name), posOf = n => (l.players.find(p => p.name === n)||{}).pos;
    const pool = U.shuffle([...correct, ...(l.bench||[]).slice(0,3), ...(l.decoys||[])]);

        el.onclick = () => { if (round.settled) return; if (st.sel && st.sel.name) { const prev = st.slots.indexOf(st.sel.name); if (prev >= 0) st.slots[prev] = st.slots[i]; st.slots[i] = st.sel.name; st.sel = null; }
          else if (st.sel && st.sel.slot !== undefined) { if (st.sel.slot === i && st.slots[i]) { st.slots[i] = null; } else { [st.slots[i], st.slots[st.sel.slot]] = [st.slots[st.sel.slot], st.slots[i]]; } st.sel = null; }

    U.$('#lres', box).onclick = () => UI.modal({title:'Reservas da partida', body: (l.bench||[]).length ? `<div class="row">${l.bench.map(n => `<span class="chip">${U.esc(n)}</span>`).join('')}</div><p class="small muted" style="margin-top:10px">Fonte: ${U.esc(l.source)}</p>` : '<p class="muted">Banco de reservas não cadastrado para este jogo.</p>'});

const Manager = {

  budget(t){ return BUDGETS[t.budgetKey]; },
  payroll(t){ return t.squad.reduce((s,x) => s + x.salary, 0); },       // R$ mil / mês
  balance(t){ return this.budget(t) - t.spent + t.income - this.payroll(t) * 12 / 1000; }, // R$ mi (temporada)

  players(t){ return t.squad.map(s => ({...this.mk(s.id), ...s})).filter(p => p.name); },
  starters(t){ return t.xi.map(id => id && this.players(t).find(p => p.id === id)); },
  strength(t){ const xi = this.starters(t).filter(Boolean); if (!xi.length) return 0; const f = FORMATIONS[t.formation]; return Math.round(xi.reduce((s,p) => { const i = t.xi.indexOf(p.id), fit = f[i].pos === p.pos ? 1 : (['LD','LE'].includes(f[i].pos) && ['LD','LE'].includes(p.pos)) ? .95 : (['VOL','MEI'].includes(f[i].pos) && ['VOL','MEI'].includes(p.pos)) ? .93 : .8; return s + p.ovr * fit; }, 0) / 11); },

  sell(t, id){ const i = t.squad.findIndex(s => s.id === id); if (i < 0) return; const m = this.mk(id); t.income += Math.round(m.value * .7 * 10) / 10; t.squad.splice(i,1); t.xi = t.xi.map(x => x === id ? null : x); t.bench = t.bench.filter(x => x !== id); Store.save(); },
  setSalary(t, id, salary){ const s = t.squad.find(x => x.id === id), m = this.mk(id); if (!s) return 'Atleta não encontrado.'; if (!Number.isFinite(salary) || salary < Math.round(m.salary*.8)) return `Mínimo aceito: R$ ${Math.round(m.salary*.8)} mil.`; const old = s.salary; s.salary = salary; if (isFinite(this.budget(t)) && this.balance(t) < 0) { s.salary = old; return 'O novo salário deixaria o saldo negativo.'; } Store.save(); return null; },
  autoXI(t){ const f = FORMATIONS[t.formation], used = new Set(), ps = this.players(t).sort((a,b) => b.ovr - a.ovr); t.xi = f.map(s => { const p = ps.find(x => !used.has(x.id) && x.pos === s.pos) || ps.find(x => !used.has(x.id) && x.pos !== 'GOL' && s.pos !== 'GOL'); if (p) { used.add(p.id); return p.id; } return null; }); t.bench = ps.filter(p => !used.has(p.id)).slice(0,9).map(p => p.id); Store.save(); },

  backup(box){
    const size = (() => { try { return Math.round((localStorage.getItem(APP.storeKey)||'').length / 1024); } catch(e) { return 0; } })();
    box.innerHTML = `<div class="grid g2"><div class="card"><h3>Exportar</h3><p class="small muted" style="margin:6px 0 12px">Uso atual: ~${size} KB de ~5.000 KB disponíveis no navegador.</p><div class="row"><button class="btn red" id="exF">Backup completo (JSON)</button><button class="btn" id="exC">Somente conteúdo (sem contas)</button></div><p class="small muted" style="margin-top:10px">O backup completo inclui contas locais com hashes de senha (nunca senhas em texto). Guarde o arquivo com cuidado e não o publique.</p></div>
    <div class="card"><h3>Importar / restaurar</h3><p class="small muted" style="margin:6px 0 12px">Aceita arquivos gerados por esta plataforma (até 10 MB).</p><input type="file" id="imf" accept="application/json,.json"><div class="row" style="margin-top:12px"><label class="row small"><input type="radio" name="mode" value="merge" checked> Mesclar conteúdo (mantém o que existe e atualiza por ID)</label><label class="row small"><input type="radio" name="mode" value="replace"> Restaurar backup completo (substitui tudo)</label></div><button class="btn red" id="imb" style="margin-top:12px">Importar arquivo</button></div></div>
    <div class="card" style="margin-top:14px"><h3>Restaurar dados iniciais</h3><p class="small muted" style="margin:6px 0 12px">Volta o conteúdo editorial ao banco original desta versão, preservando contas, pontuações e gestões.</p><button class="btn ghost" id="rs">Restaurar conteúdo original</button></div>`;
    const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
    U.$('#exF', box).onclick = () => Admin.download(`falavascao-backup-${stamp}.json`, {...Store.db, exportedAt:new Date().toISOString(), kind:'full'});
    U.$('#exC', box).onclick = () => { const c = {v:APP.dataVersion, kind:'content', exportedAt:new Date().toISOString(), meta:Store.db.meta}; Admin.CONTENT.forEach(k => c[k] = Store.db[k]); Admin.download(`falavascao-conteudo-${stamp}.json`, c); };
    U.$('#imb', box).onclick = async () => { const f = U.$('#imf', box).files[0]; if (!f) return UI.toast('Escolha um arquivo .json.', 'warn'); if (f.size > 10e6) return UI.toast('Arquivo maior que 10 MB.', 'err');
      let data; try { data = Admin.safeParse(await f.text()); } catch(e) { return UI.toast('Arquivo inválido: não é um JSON legível.', 'err'); }
      if (!data || typeof data !== 'object' || data.v !== APP.dataVersion) return UI.toast('Arquivo incompatível com esta versão da plataforma.', 'err');
      const bad = Admin.CONTENT.filter(k => k in data && !Array.isArray(data[k])); if (bad.length) return UI.toast('Estrutura inválida em: ' + bad.join(', '), 'err');
      const mode = U.$('[name="mode"]:checked', box).value;
      if (mode === 'replace') { if (data.kind !== 'full' || !Array.isArray(data.users)) return UI.toast('Para restaurar tudo, use um backup completo.', 'err'); if (!await UI.confirm('Substituir TODOS os dados deste navegador pelo backup? Contas e pontuações atuais serão trocadas.', {ok:'Restaurar backup'})) return;
        const backup = JSON.stringify(Store.db); try { delete data.exportedAt; delete data.kind; Store.db = data; Store.migrate(); if (!Store.save()) throw new Error('falha ao salvar'); } catch(e) { Store.db = JSON.parse(backup); return UI.toast('Restauração cancelada: ' + e.message, 'err'); }
        Auth.restore(); }
      else { if (!await UI.confirm('Mesclar o conteúdo do arquivo com o atual? Registros com o mesmo ID serão substituídos.', {ok:'Mesclar', danger:false})) return;
        Admin.CONTENT.forEach(k => { if (!Array.isArray(data[k])) return; if (k === 'curiosities') { Store.db.curiosities = [...new Set([...Store.db.curiosities, ...data[k].filter(x => typeof x === 'string')])]; return; } data[k].forEach(r => { if (r && typeof r === 'object') { if (!r.id) r.id = U.uid(k.slice(0,3)); const c = Store.col(k), i = c.findIndex(x => x.id === r.id); i >= 0 ? c[i] = r : c.push(r); } }); });
        if (data.meta && typeof data.meta === 'object') Object.assign(Store.db.meta, data.meta); Store.save(); }
      UI.toast('Importação concluída.'); Shell.renderNav(); Shell.refreshUser(); Router.render(); };
    U.$('#rs', box).onclick = async () => { if (!await UI.confirm('Restaurar o conteúdo editorial original? Notícias, títulos, perguntas e demais registros editados serão perdidos (contas e pontuações ficam).', {ok:'Restaurar'})) return; const s = U.clone(SEED); Admin.CONTENT.forEach(k => Store.db[k] = s[k]); Store.db.meta = s.meta; Store.save(); UI.toast('Conteúdo original restaurado.'); Router.render(); };
  },
  usuarios(box){
    const draw = () => { box.innerHTML = `<p class="small muted" style="margin-bottom:12px">Contas existentes apenas neste navegador.</p><div class="tablewrap"><table><thead><tr><th>Login</th><th>Nome</th><th>Papel</th><th>Pontos</th><th></th></tr></thead><tbody>${Store.db.users.map(u => `<tr><td>${U.esc(u.login)}</td><td>${U.esc(u.name)}</td><td>${u.role === 'admin' ? 'Administrador' : 'Torcedor'}</td><td>${u.profile.points}</td><td>${u.id === Auth.user().id ? '<span class="small muted">Você</span>' : `<button class="btn sm ghost" data-role="${u.id}">${u.role === 'admin' ? 'Tornar torcedor' : 'Tornar admin'}</button> <button class="btn sm ghost" data-rm="${u.id}">Remover</button>`}</td></tr>`).join('')}</tbody></table></div>`;
      U.$$('[data-role]', box).forEach(b => b.onclick = async () => { const u = Store.db.users.find(x => x.id === b.dataset.role); if (!await UI.confirm(`Alterar o papel de ${u.login}?`, {danger:false})) return; u.role = u.role === 'admin' ? 'torcedor' : 'admin'; Store.save(); UI.toast('Papel alterado.'); draw(); });
      U.$$('[data-rm]', box).forEach(b => b.onclick = async () => { const u = Store.db.users.find(x => x.id === b.dataset.rm); if (!await UI.confirm(`Remover a conta ${u.login} e todo o seu progresso?`, {ok:'Remover'})) return; Store.db.users = Store.db.users.filter(x => x.id !== u.id); Store.save(); UI.toast('Conta removida.'); draw(); }); };
    draw();
  }
};


/* =====================================================================
   VISUAIS + CONTAGEM REGRESSIVA
   ===================================================================== */
const SKINS = {
  classico:{name:'Clássico', desc:'A faixa diagonal da camisa em destaque. Preto, branco e vermelho.', prev:'<div style="position:absolute;inset:0;background:#000"></div><div style="position:absolute;left:-20%;right:-20%;top:40%;height:12px;background:#fff;transform:rotate(-14deg)"></div><div style="position:absolute;right:8px;top:8px;width:14px;height:14px;background:#d7141a;transform:rotate(45deg)"></div>'},
  app:{name:'App esportivo', desc:'Inspirado em apps de placar: cartões arredondados, abas em pílula e foco no jogo.', prev:'<div style="position:absolute;inset:0;background:#0d0f12"></div><div style="position:absolute;left:8px;right:8px;top:8px;height:24px;border-radius:8px;background:radial-gradient(circle at 80% 20%,#d7141a,#1b1f25)"></div><div style="position:absolute;left:8px;width:34px;bottom:8px;height:16px;border-radius:6px;background:#20242b"></div><div style="position:absolute;right:8px;width:34px;bottom:8px;height:16px;border-radius:6px;background:#20242b"></div>'},
  game:{name:'Videogame', desc:'Neon, cortes angulares e fichas de ídolos no formato de carta de jogador.', prev:'<div style="position:absolute;inset:0;background:#06060a;background-image:linear-gradient(rgba(255,31,61,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(255,31,61,.25) 1px,transparent 1px);background-size:10px 10px"></div><div style="position:absolute;left:30px;top:6px;width:30px;height:50px;background:linear-gradient(160deg,#fff3a8,#a8801f);clip-path:polygon(50% 0,100% 6%,100% 86%,50% 100%,0 86%,0 6%)"></div>'},
  editorial:{name:'Editorial premium', desc:'Tipografia de revista, capitulares e manchetes grandes.', prev:'<div style="position:absolute;inset:0;background:#000;border-top:4px solid #fff"></div><div style="position:absolute;left:8px;top:12px;font:900 italic 22px Georgia,serif;color:#fff">Fala<span style="color:#ff3b41">!</span></div><div style="position:absolute;left:8px;right:8px;bottom:10px;height:1px;background:#555"></div>'}
};
const Skin = {
  get(){ return document.documentElement.dataset.skin || 'classico'; },
  set(k){ if (!SKINS[k]) return; if (k === 'classico') delete document.documentElement.dataset.skin; else document.documentElement.dataset.skin = k; try { localStorage.setItem('falavascao:skin', k); } catch(e){} },
  restore(){ try { const k = localStorage.getItem('falavascao:skin'); if (SKINS[k] && k !== 'classico') document.documentElement.dataset.skin = k; } catch(e){} },
  chooser(){
    const cur = this.get();
    const m = UI.modal({title:'Escolha o visual do site', body:`<p class="small muted" style="margin-bottom:12px">Todas as funções continuam iguais. A escolha fica salva neste navegador.</p>${Object.entries(SKINS).map(([k,s]) => `<button class="skin-opt ${k===cur?'on':''}" data-skin-k="${k}"><span class="skin-prev">${s.prev}</span><span><b>${s.name}</b><span class="small muted">${s.desc}</span></span></button>`).join('')}`});
    U.$$('[data-skin-k]', m.el).forEach(b => b.onclick = () => { this.set(b.dataset.skinK); m.close(); Router.render(); UI.toast('Visual aplicado: ' + SKINS[b.dataset.skinK].name); });
  },
  init(){
    const b = U.$('#skinBtn'); b.innerHTML = ICO('palette'); b.onclick = () => this.chooser();
    let seen = false; try { seen = localStorage.getItem('falavascao:skinSeen') === '1'; localStorage.setItem('falavascao:skinSeen','1'); } catch(e){ seen = true; }
    if (!seen) setTimeout(() => this.chooser(), 900);
  },
  posAbbr(pos){ const n = U.norm(pos); return n.startsWith('goleiro') ? 'GOL' : n.includes('direito') ? 'LD' : n.includes('esquerdo') ? 'LE' : n.startsWith('zagueiro') ? 'ZAG' : n.startsWith('volante') ? 'VOL' : n.startsWith('meia') ? 'MEI' : n.startsWith('atacante') ? 'ATA' : n.slice(0,3).toUpperCase(); },
  market(p){ const names = [p.name, ...(p.aliases||[])].map(U.norm); return MARKET.find(m => names.includes(U.norm(m.name))); },
  playerCard(p){
    const skin = this.get();
    if (skin === 'game') { const m = this.market(p);
      return `<div class="card click fut ${p.idol?'gold':'silver'}" data-id="${p.id}" title="Atributos recreativos"><div class="fut-top"><div style="text-align:left"><span class="fut-ovr">${m ? m.ovr : '—'}</span><span class="fut-pos">${this.posAbbr(p.pos)}</span></div>${CROSS(30)}</div><div class="fut-face">${U.esc(U.initials(p.name))}</div><div class="fut-name">${U.esc(p.name)}</div>${m ? `<div class="fut-attrs"><span><b>${m.spd}</b>VEL</span><span><b>${m.fin}</b>FIN</span><span><b>${m.pas}</b>PAS</span><span><b>${m.tec}</b>TEC</span><span><b>${m.def}</b>DEF</span><span><b>${m.phy}</b>FIS</span></div>` : '<div class="small">Sem avaliação</div>'}<div class="fut-foot">${U.spanText(p.spans)} · avaliação recreativa</div>${Pages.adminBar('players', p.id)}</div>`; }
    if (skin === 'editorial') { const first = String(p.bio||'').split(/(?<=\.)\s/)[0];
      return `<div class="card click" data-id="${p.id}"><div class="kicker">${U.esc(p.pos)}, ${U.spanText(p.spans)}</div><h3 style="font-size:30px;margin:2px 0 8px">${U.esc(p.name)}</h3><p class="muted">${U.esc(first)}</p>${p.idol?'<p class="small" style="margin-top:8px;font-style:italic">Ídolo da Colina</p>':''}${Pages.adminBar('players', p.id)}</div>`; }
    return `<div class="card click" data-id="${p.id}"><div class="row" style="justify-content:space-between"><span class="avatar" style="width:44px;height:44px;font-size:20px">${U.esc(U.initials(p.name))}</span>${p.idol?'<span class="st ok">Ídolo</span>':''}</div><h3 style="margin-top:10px">${U.esc(p.name)}</h3><p class="small muted">${U.esc(p.pos)} · ${U.spanText(p.spans)}</p>${Pages.adminBar('players', p.id)}</div>`;
  }
};
const Countdown = {
  target(m){ return new Date(`${m.date}T${/^\d{2}:\d{2}$/.test(m.time||'') ? m.time : '12:00'}:00-03:00`); },
  text(t){ const ms = t - Date.now(); if (isNaN(ms)) return 'n/d'; if (ms <= 0) return 'bola rolando ou encerrado'; const d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5), mi = Math.floor(ms%36e5/6e4); return `${d ? d + 'd ' : ''}${h}h ${String(mi).padStart(2,'0')}min`; },
  tick(){ U.$$('[data-cd]').forEach(el => { el.textContent = Countdown.text(new Date(el.dataset.cd)); }); }
};
setInterval(() => Countdown.tick(), 30000);

/* =====================================================================
   BOOT
   ===================================================================== */
window.addEventListener('error', e => { console.error(e.error || e.message); try { UI.toast('Ocorreu um erro inesperado. Seus dados salvos não foram afetados.', 'err'); } catch(_){} });
window.addEventListener('unhandledrejection', e => { console.error(e.reason); try { UI.toast('Uma operação falhou: ' + (e.reason && e.reason.message || 'erro desconhecido'), 'err'); } catch(_){} });
(function boot(){
  try {
    try { const t = localStorage.getItem('falavascao:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch(e){}
    Skin.restore(); Store.load(); Auth.restore(); Shell.init(); Skin.init();
    if (!location.hash) history.replaceState(null, '', '#/inicio');
    Router.render();
    if (!Store.probe()) UI.toast('O navegador está bloqueando o armazenamento local: seus dados não serão mantidos ao fechar.', 'warn', 7000);
    const b = U.$('#boot'); b.style.opacity = '0'; setTimeout(() => b.remove(), 400);
  } catch(e) { console.error(e); U.$('#bootMsg').textContent = 'Não foi possível iniciar: ' + e.message + '. Tente outro navegador ou limpe os dados do site.'; }
})();
</script>
</body>
